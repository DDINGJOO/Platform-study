server:
  port: 8080
spring:
  application:
    name: order-api
  datasource:
    url: jdbc:postgresql://db:5432/shop
    username: shop
    password: shop
    hikari:
      maximum-pool-size: 10
      # 커넥션을 1초 안에 못 빌리면 SQLTransientConnectionException. 이것이 "타임아웃"의 시작이다.
      connection-timeout: 1000
shop:
  query-variant: ${QUERY_VARIANT:exact}
  banner: ${BANNER:}
  version: ${APP_VERSION:dev}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # p99 를 서버 쪽에서도 계산하려고 히스토그램 버킷을 내보낸다
      percentiles-histogram:
        http.server.requests: true
