# 단일 바이너리 Loki. 로컬 파일시스템에 저장한다. (Loki 이미지의 local-config 를 줄인 것)
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: info
common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
analytics:
  reporting_enabled: false
