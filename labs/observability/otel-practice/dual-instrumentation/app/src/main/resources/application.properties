spring.application.name=${LAB_MODE:micrometer}
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://collector:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.schedule-delay=500ms
management.opentelemetry.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level mode=${LAB_MODE:micrometer} traceId=%X{traceId:-empty} spanId=%X{spanId:-empty} trace_id=%X{trace_id:-empty} span_id=%X{span_id:-empty} %msg%n
