receivers:
  otlp/plain:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/short:
    protocols:
      http:
        endpoint: 0.0.0.0:4328
  otlp/long:
    protocols:
      http:
        endpoint: 0.0.0.0:4338
processors:
  tail_sampling/short:
    decision_wait: 2s
    num_traces: 1000
    decision_cache:
      sampled_cache_size: 1000
      non_sampled_cache_size: 1000
    policies:
      - name: keep-errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: keep-slow
        type: latency
        latency: {threshold_ms: 200}
  tail_sampling/long:
    decision_wait: 8s
    num_traces: 1000
    decision_cache:
      sampled_cache_size: 1000
      non_sampled_cache_size: 1000
    policies:
      - name: keep-errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: keep-slow
        type: latency
        latency: {threshold_ms: 200}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  file/ingress:
    path: /out/ingress.jsonl
    flush_interval: 100ms
  file/plain:
    path: /out/plain.jsonl
    flush_interval: 100ms
  file/short:
    path: /out/short.jsonl
    flush_interval: 100ms
  file/long:
    path: /out/long.jsonl
    flush_interval: 100ms
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/ingress:
      receivers: [otlp/short, otlp/long]
      exporters: [file/ingress]
    traces/plain:
      receivers: [otlp/plain]
      exporters: [otlp/tempo, file/plain]
    traces/short:
      receivers: [otlp/short]
      processors: [tail_sampling/short]
      exporters: [otlp/tempo, file/short]
    traces/long:
      receivers: [otlp/long]
      processors: [tail_sampling/long]
      exporters: [otlp/tempo, file/long]
