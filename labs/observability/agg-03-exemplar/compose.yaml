# 집계와 분포 실습-3: 히스토그램 점을 눌러 트레이스로 넘어간다.
# 앱(Micrometer + OTel 브리지) → 지표는 Prometheus 가 긁고, 트레이스는 OTLP 로 Tempo 에 바로 보낸다.
services:
  app:
    build: ./app
    image: obs-lab/agg-03-exemplar:dev
    mem_limit: 450m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      TRACING_PROBABILITY: ${TRACING_PROBABILITY:-1.0}
    ports: ["${APP_PORT:-23381}:8080"]

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports: ["${TEMPO_PORT:-23320}:3200"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage   # 이 플래그가 없으면 exemplar 를 받아도 버린다
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-23390}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-23300}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    volumes:
      - ./k6:/scripts:ro
