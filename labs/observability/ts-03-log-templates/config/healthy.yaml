# 정상 인스턴스의 애플리케이션 설정
server:
  port: 8080
  shutdown: graceful
spring:
  datasource:
    url: jdbc:postgresql://db:5432/shop
    hikari:
      maximum-pool-size: 50
      connection-timeout: 30000
shop:
  address-service:
    url: http://address:8080
    timeout-ms: 800
    max-attempts: 3
  customer:
    require-address: true
  cache:
    customer-ttl-seconds: 600
  payment:
    slow-threshold-ms: 500
logging:
  level:
    root: INFO
