# SLO와 경고 실습-2: 모든 자바 서비스에 같은 SLI 대시보드를 깐다.
# 앱은 실습-1 과 같은 코드다(../slo-01-burn-rate/app). 서비스 이름만 바꿔 두 개를 띄운다.
x-app: &app
  build: ../slo-01-burn-rate/app
  image: obs-lab/slo-01-burn-rate:dev
  mem_limit: 512m

services:
  orders:
    <<: *app
    environment:
      APP_NAME: orders
      JAVA_TOOL_OPTIONS: -Xmx256m
      # 스레드 풀 포화를 쉽게 재현하려고 톰캣 작업 스레드를 20개로 줄였다(기본 200)
      TOMCAT_MAX_THREADS: "20"
    ports: ["${ORDERS_PORT:-24180}:8080"]

  payments:
    <<: *app
    environment:
      APP_NAME: payments
      # orders 는 JVM 이 고른 GC 를 그대로 쓴다(메모리 한도 512MB 라서 Serial).
      # payments 는 G1 을 직접 지정했다. 같은 대시보드가 GC 종류가 달라도 읽히는지 본다.
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseG1GC
    ports: ["${PAYMENTS_PORT:-24181}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-24190}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-24130}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/load.js"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # 클라이언트(k6)가 잰 지연을 Prometheus 네이티브 히스토그램으로 보낸다. 서버 타이머와 비교용
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      TARGET: ${TARGET:-orders}
      RATE: ${RATE:-30}
      DURATION: ${DURATION:-10m}
    volumes:
      - ./k6:/scripts:ro
