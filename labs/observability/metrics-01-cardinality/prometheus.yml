global:
  scrape_interval: 5s          # 실습 시간을 줄이려고 5초로 줄였다(기본 1분)
  extra_scrape_metrics: true   # scrape_body_size_bytes 를 남긴다
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
