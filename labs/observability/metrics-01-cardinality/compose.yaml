# 메트릭 수집 실습-1: 태그 하나가 시계열을 몇 개로 늘리는지 세어 본다.
# 호스트 포트: Grafana 21000, Prometheus 21090, 앱 21080
services:
  app:
    build: ./app
    image: obs-lab/metrics-01-cardinality:dev
    environment:
      LAB_USER_TAG: ${LAB_USER_TAG:-none}
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    ports: ["${APP_PORT:-21080}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.min-block-duration=${PROM_BLOCK:-2h}   # 5절: head 정리를 빨리 보려고 줄여 본다
    volumes:
      - ./${PROM_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    mem_limit: 1g
    ports: ["${PROM_PORT:-21090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 300m
    ports: ["${GRAFANA_PORT:-21000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "--quiet", "/scripts/users.js"]
    environment:
      USERS: ${USERS:-1000}
    volumes:
      - ./k6:/scripts:ro
