# 실습용으로 30일 기본 창(google-30d)을 30분의 1로 줄인 창.
# 비율(errorBudgetPercent)은 그대로 두고 SLO 기간과 창 길이만 1/30 로 줄였다.
# 그래서 burn rate 계수(14.4, 6, 3, 1)는 30일 기본값과 같게 나온다.
#   30일 기본         →  실습용(1/30)
#   SLO 기간 30d      →  1d
#   page 빠른 창 1h/5m  →  2m/10s
#   page 느린 창 6h/30m →  12m/1m
#   ticket 빠른 1d/2h  →  48m/4m
#   ticket 느린 3d/6h  →  144m/12m
apiVersion: "sloth.slok.dev/v1"
kind: "AlertWindows"
spec:
  sloPeriod: 1d
  page:
    quick:
      errorBudgetPercent: 2
      shortWindow: 10s
      longWindow: 2m
    slow:
      errorBudgetPercent: 5
      shortWindow: 1m
      longWindow: 12m
  ticket:
    quick:
      errorBudgetPercent: 10
      shortWindow: 4m
      longWindow: 48m
    slow:
      errorBudgetPercent: 10
      shortWindow: 12m
      longWindow: 144m
