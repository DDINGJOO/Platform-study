# SLO와 경고 실습-1: SLO 하나로 burn rate 경고를 만들고 실제로 울린다.
# 호스트 포트는 24000번대. 바꾸려면 환경변수로.
services:
  app:
    build: ./app
    image: obs-lab/slo-01-burn-rate:dev
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    ports: ["${APP_PORT:-24080}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/slo-rules.yaml:/etc/prometheus/slo-rules.yaml:ro
    ports: ["${PROM_PORT:-24090}:9090"]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["${AM_PORT:-24093}:9093"]

  webhook:
    image: python:3.13-alpine
    command: ["python", "-u", "/receiver.py"]
    volumes:
      - ./webhook/receiver.py:/receiver.py:ro

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-24030}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "--quiet", "/scripts/steady.js"]
    environment:
      RATE: ${RATE:-40}
      DURATION: ${DURATION:-180m}
    volumes:
      - ./k6:/scripts:ro
