server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:shop
  sql:
    init:
      mode: never
shop:
  inventory-url: http://inventory:8080
  payment-url: http://payment:8080
  # 글 5절: 주문(입구) 서비스가 바깥에서 온 chaos baggage 를 믿을지
  baggage-guard: ${SHOP_BAGGAGE_GUARD:false}
  chaos-token: ${SHOP_CHAOS_TOKEN:}
