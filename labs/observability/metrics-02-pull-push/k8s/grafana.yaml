apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: obs }
data:
  ds.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prometheus, type: prometheus, url: "http://prometheus:9090", isDefault: true, jsonData: { timeInterval: 10s } }
# 대시보드 ConfigMap(grafana-dashboards)은 up.sh 가 k8s/grafana-provider.yaml 과 k8s/dashboard.json 으로 만든다.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: obs }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_USERS_DEFAULT_THEME, value: light }
          ports: [{ containerPort: 3000 }]
          resources: { limits: { memory: 512Mi } }
          volumeMounts:
            - { name: ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dash, mountPath: /etc/grafana/provisioning/dashboards }
      volumes:
        - { name: ds, configMap: { name: grafana-datasources } }
        - { name: dash, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: obs }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30030 }]
