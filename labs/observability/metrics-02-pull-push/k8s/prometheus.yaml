apiVersion: v1
kind: Namespace
metadata: { name: obs }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: obs }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: obs-prometheus }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: obs-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: obs-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: obs }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus, namespace: obs }
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s        # 실습 시간을 줄이려고 10초(기본 1분)
      scrape_timeout: 5s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      # pull: 쿠버네티스 API 에서 파드 목록을 받아, 애노테이션이 붙은 파드만 긁는다
      - job_name: pull-app
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [obs] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # push 경로 2: Collector 가 받은 값을 Prometheus 형식으로 다시 내놓는 곳
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8889']
  rules.yml: |
    groups:
      - name: silence
        rules:
          - alert: PullTargetDown          # 긁으러 갔는데 실패했다
            expr: up{job="pull-app"} == 0
          - alert: PullTargetAbsent        # 긁을 대상 자체가 없다
            expr: absent(up{job="pull-app"})
          - alert: PushSeriesAbsent        # 밀어 넣던 시계열이 쿼리에서 사라졌다
            expr: absent(shop_orders_total{job="push-app"})
          - alert: PushNoSampleFor30s      # 최근 30초 동안 새 샘플이 없다
            expr: absent_over_time(shop_orders_total{job="push-app"}[30s])
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: obs }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-otlp-receiver       # push 경로 1: OTLP 를 직접 받는다
          ports: [{ containerPort: 9090 }]
          resources: { limits: { memory: 512Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: obs }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30090 }]
