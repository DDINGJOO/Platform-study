apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector, namespace: obs }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      # push 경로 1: Prometheus 의 OTLP 수신 엔드포인트로 그대로 민다
      otlp_http/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls: { insecure: true }
      # push 경로 2: Collector 가 받은 값을 :8889 에 Prometheus 형식으로 걸어 둔다(Prometheus 가 긁는다)
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [otlp_http/prometheus, prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: obs }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: [--config=/etc/otelcol/config.yaml]
          ports: [{ containerPort: 4318 }, { containerPort: 8889 }]
          resources: { limits: { memory: 256Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: obs }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prom, port: 8889, targetPort: 8889 }
