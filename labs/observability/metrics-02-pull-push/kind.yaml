# 메트릭 수집 실습-2 전용 kind 클러스터. 노드 하나.
# NodePort 를 호스트 포트로 꺼낸다: Prometheus 21290, Grafana 21200
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obs-lab-metrics-02
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30090, hostPort: 21290, listenAddress: "127.0.0.1" }
      - { containerPort: 30030, hostPort: 21200, listenAddress: "127.0.0.1" }
