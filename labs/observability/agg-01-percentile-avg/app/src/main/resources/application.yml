server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 버킷을 재료째 내보낸다. Prometheus 가 인스턴스를 합쳐서 p99 를 계산할 수 있다.
      # 이 값은 이름 앞부분이 같은 http.server.requests.active 에도 적용된다
      percentiles-histogram:
        http.server.requests: true
      # 인스턴스가 직접 계산한 p99 (클라이언트 백분위). 인스턴스끼리 합칠 수 없다
      percentiles:
        lab.work: 0.99
