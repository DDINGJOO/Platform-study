# 집계와 분포 실습-1: 인스턴스 세 대의 p99를 평균 내면 틀린다.
# 같은 이미지를 세 번 띄우고 app-c 만 느린 요청을 섞는다. 관측은 Prometheus + Grafana 만 쓴다.
x-app: &app
  build: ./app
  image: obs-lab/agg-01-percentile-avg:dev
  mem_limit: 400m
  environment: &app-env
    JAVA_TOOL_OPTIONS: -Xmx256m

services:
  app-a:
    <<: *app
    ports: ["${APP_PORT:-23081}:8080"]

  app-b:
    <<: *app

  app-c:
    <<: *app
    environment:
      <<: *app-env
      LAB_SLOW_RATIO: ${SLOW_RATIO:-0.1}   # 요청의 10%를 300~500ms로 늦춘다

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-23090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-23000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "--summary-trend-stats=avg,p(50),p(99),max", "--out", "csv=/out/raw.csv", "/scripts/load.js"]
    volumes:
      - ./k6:/scripts:ro
      - ./out:/out
