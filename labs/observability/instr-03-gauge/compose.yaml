# 계측 라이브러리 실습-3: 게이지가 NaN이 되는 순간을 만든다.
services:
  app:
    build: ./app
    image: obs-lab/instr-03-gauge:dev
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    mem_limit: 512m
    ports: ["${APP_PORT:-22280}:8080"]
    depends_on: [otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-22290}:9090"]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
    ports: ["${GRAFANA_PORT:-22230}:3000"]
    mem_limit: 512m   # 256m 에서는 Explore 를 여는 순간 OOM 으로 죽었다
