plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

// Prometheus(pull)와 OTLP(push) 두 레지스트리에서 NaN 이 어떻게 나가는지 같이 본다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'   // pull: /actuator/prometheus
    implementation 'io.micrometer:micrometer-registry-otlp'         // push: OTLP/HTTP
    implementation 'org.springframework.boot:spring-boot-opentelemetry' // OTLP 자동 구성의 조건 클래스(OpenTelemetryProperties)가 여기 있다
}
