global:
  scrape_interval: 5s
scrape_configs:
  - job_name: statsd_exporter          # 받은 패킷 수, 내부 큐에서 버린 수, 그리고 lab_sent_total 값
    static_configs:
      - targets: ['statsd:9102']
  - job_name: kernel                   # statsd 컨테이너와 네트워크 네임스페이스를 같이 쓰는 node_exporter
    static_configs:
      - targets: ['statsd:9100']
  - job_name: sender                   # 보낸 쪽이 직접 센 수
    static_configs:
      - targets: ['sender:8000']
