server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:shop
  sql:
    init:
      mode: never
shop:
  inventory-url: http://inventory:8080
  payment-url: http://payment:8080
logging:
  # 에이전트가 로그백 MDC 에 넣어 주는 trace_id, span_id 를 로그 줄에 찍는다.
  # 값이 없으면 빈칸으로 남는다(스팬 밖에서 찍힌 로그).
  pattern:
    level: "%5p trace_id=%X{trace_id:-} span_id=%X{span_id:-}"
