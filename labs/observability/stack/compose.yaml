# 모든 실습이 같이 쓰는 관측 스택. 실습 폴더의 compose.yaml 이 include 한다.
# 호스트 포트는 환경변수로 바꿀 수 있다(실습 여러 개를 동시에 띄울 때). 기본값은 표준 포트.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports: ["${TEMPO_PORT:-3200}:3200"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
