# 집계와 분포 실습-5: 같은 대시보드를 색각 이상의 눈으로 본다.
# 앱 하나(엔드포인트 다섯 개) + Prometheus + Grafana. 대시보드는 기본값 그대로인 것과 고친 것 두 개.
services:
  app:
    build: ./app
    image: obs-lab/agg-05-colorblind:dev
    mem_limit: 350m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx128m
    ports: ["${APP_PORT:-21081}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-21090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: ${GF_THEME:-light}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-21000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    volumes:
      - ./k6:/scripts:ro
