# 집계와 분포 실습-2: 에러율을 PromQL에서 비율로 그린다.
# 같은 이미지를 두 번 띄운다. 트래픽은 run.sh 가 k6 로 출렁이게 주고, 중간에 실패율을 바꾼다.
x-app: &app
  build: ./app
  image: obs-lab/agg-02-error-ratio:dev
  mem_limit: 400m
  environment:
    JAVA_TOOL_OPTIONS: -Xmx256m

services:
  app-a:
    <<: *app
    ports: ["${APP_A_PORT:-23181}:8080"]

  app-b:
    <<: *app
    ports: ["${APP_B_PORT:-23182}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-23190}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-23100}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    volumes:
      - ./k6:/scripts:ro
