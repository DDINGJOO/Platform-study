# 집계와 분포 실습-4: 부하 생성기가 숨긴 지연을 다시 찾는다.
# 같은 앱을 세 번 띄우고, 부하 생성기 셋이 각자 하나씩 맡는다.
#   app-closed  ← k6 닫힌 모델 (VU 10개, 100ms 간격)
#   app-open    ← k6 열린 모델 (초당 100건, VU 300개)
#   app-starved ← k6 열린 모델 (초당 100건, VU 20개: 멈춤을 감당하지 못한다)
# 멈춤은 scripts/pause-loop.sh 가 docker pause 로 세 앱을 동시에 얼려서 만든다.
x-app: &app
  build: ./app
  image: obs-lab/agg-04-coordinated-omission:dev
  mem_limit: 350m
  environment:
    JAVA_TOOL_OPTIONS: -Xmx128m

x-k6: &k6
  image: grafana/k6:2.3.0
  profiles: [load]
  volumes:
    - ./k6:/scripts:ro
    - ./out:/out
  environment: &k6-env
    K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    K6_PROMETHEUS_RW_TREND_STATS: p(99),max
    DURATION: ${DURATION:-5m}

services:
  app-closed:
    <<: *app
    ports: ["${APP_PORT:-21081}:8080"]
  app-open:
    <<: *app
  app-starved:
    <<: *app

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver     # k6 가 결과를 밀어 넣는다
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-21090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-21000}:3000"]

  load-closed:
    <<: *k6
    command: ["run", "--tag", "run=closed", "-o", "experimental-prometheus-rw", "--out", "csv=/out/closed.csv", "/scripts/closed.js"]
  load-open:
    <<: *k6
    command: ["run", "--tag", "run=open", "-o", "experimental-prometheus-rw", "--out", "csv=/out/open.csv", "/scripts/open.js"]
  load-starved:
    <<: *k6
    environment:
      <<: *k6-env
      TARGET: app-starved
      VUS: "20"
    command: ["run", "--tag", "run=starved", "-o", "experimental-prometheus-rw", "--out", "csv=/out/starved.csv", "/scripts/open.js"]
