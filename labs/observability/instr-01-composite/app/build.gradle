plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

// 레지스트리 구현체를 두 개 넣는다. 스프링 부트는 MeterRegistry 빈이 둘 이상이면
// CompositeMeterRegistry 를 만들어 @Primary 로 내놓는다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'   // pull: /actuator/prometheus
    implementation 'io.micrometer:micrometer-registry-otlp'         // push: OTLP/HTTP
    implementation 'org.springframework.boot:spring-boot-opentelemetry' // OTLP 자동 구성의 조건 클래스(OpenTelemetryProperties)가 여기 있다
}
