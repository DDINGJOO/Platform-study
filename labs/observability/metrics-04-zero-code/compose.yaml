# 메트릭 수집 실습-4: 코드 없이 프로파일과 지표를 얻는다.
# 호스트 포트: Grafana 21400, Prometheus 21490, Pyroscope 21440, 앱 21480
services:
  app:
    build: ./app
    image: obs-lab/metrics-04-zero-code:dev
    environment:
      # Pyroscope 자바 에이전트(async-profiler 기반). 앱 코드와 의존성에는 아무것도 없다.
      JAVA_TOOL_OPTIONS: -Xmx256m -javaagent:/pyroscope/pyroscope.jar
      PYROSCOPE_APPLICATION_NAME: shop
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_FORMAT: jfr                 # CPU 와 할당을 같이 보내려면 jfr
      PYROSCOPE_PROFILER_EVENT: ${PROFILER_EVENT:-itimer}
      PYROSCOPE_PROFILER_ALLOC: 512k        # 문서가 권하는 시작값
      PYROSCOPE_LABELS: env=lab,impl=${REPORT_IMPL:-format}
      REPORT_IMPL: ${REPORT_IMPL:-format}   # 4절: builder 로 바꾸면 고친 구현
    mem_limit: 512m
    ports: ["${APP_PORT:-21480}:8080"]

  beyla:
    # eBPF 로 app 컨테이너의 HTTP 요청을 커널에서 본다. app 과 PID 네임스페이스를 같이 쓴다.
    image: grafana/beyla:3.38.0
    pid: "service:app"
    privileged: true
    environment:
      BEYLA_OPEN_PORT: 8080                 # 이 포트를 연 프로세스를 계측한다
      BEYLA_PROMETHEUS_PORT: 9400           # RED 지표를 Prometheus 형식으로 내보낸다
      BEYLA_SERVICE_NAME: shop
      OTEL_EBPF_JAVAAGENT_ENABLED: ${OBI_JAVAAGENT:-true}   # false 면 JVM 에 자바 에이전트를 붙이지 않는다(4절)
    mem_limit: 512m
    profiles: [ebpf]

  pyroscope:
    image: grafana/pyroscope:2.3.2
    # 프로파일 하나(압축 풀린 크기)의 상한. 기본값 4MiB 에서는 이 앱의 10초치 JFR 이 대부분 422 로 거절됐다(3절).
    command: ["-config.file=/etc/pyroscope/config.yaml", "-validation.max-profile-size-bytes=${PYROSCOPE_MAX_PROFILE_BYTES:-4194304}"]
    mem_limit: 512m
    ports: ["${PYROSCOPE_PORT:-21440}:4040"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m
    ports: ["${PROM_PORT:-21490}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 768m                       # 400m 에서는 프로파일 쿼리 중 OOM 으로 죽었다
    ports: ["${GRAFANA_PORT:-21400}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "--quiet", "/scripts/load.js"]
    environment:
      DURATION: ${DURATION:-3m}
    volumes:
      - ./k6:/scripts:ro
