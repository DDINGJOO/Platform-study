server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:shop
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: payment
      auto-offset-reset: earliest
logging:
  # 에이전트가 MDC 에 넣는 trace_id, span_id 를 로그 줄에 찍는다. 비어 있으면 컨텍스트가 없는 스레드다.
  pattern:
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"
