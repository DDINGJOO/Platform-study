# 추적과 디버깅 실습-2: Kafka를 건너도 트레이스가 이어지는지 본다.
# 주문(order) → Kafka orders 토픽 → 결제 컨슈머(payment)
include:
  - ../stack/compose.yaml

x-shop: &shop
  build: ./app
  image: obs-lab/tracing-02-kafka:dev
  depends_on: [kafka]
  mem_limit: 512m
  environment: &shop-env
    JAVA_TOOL_OPTIONS: -Xmx256m -javaagent:/otel/opentelemetry-javaagent.jar
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none
    # messaging 으로 두면 최신 메시징 규약 이름(send/process, messaging.operation.type)으로 낸다(글 2절)
    OTEL_SEMCONV_STABILITY_OPT_IN: ${SEMCONV_OPT_IN:-}

services:
  kafka:
    image: apache/kafka:4.3.1          # KRaft 단일 노드(브로커 겸 컨트롤러). ZooKeeper 없음
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m

  order:
    <<: *shop
    environment:
      <<: *shop-env
      SPRING_PROFILES_ACTIVE: order
      OTEL_SERVICE_NAME: order
    ports: ["${APP_PORT:-8080}:8080"]

  payment:
    <<: *shop
    environment:
      <<: *shop-env
      SPRING_PROFILES_ACTIVE: payment
      OTEL_SERVICE_NAME: payment
      SHOP_PAYMENT_HANDOFF: ${HANDOFF:-inline}
      SHOP_PAYMENT_BATCH: ${BATCH:-false}
      # true 로 두면 에이전트가 poll 단위 receive 스팬을 따로 만든다(글 3절). 2.32.0 에서 deprecated 된 이름(새 이름 OTEL_INSTRUMENTATION_COMMON_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED)
      OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED: ${RECEIVE_TELEMETRY:-false}

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/orders.js"]
    volumes:
      - ./k6:/scripts:ro
