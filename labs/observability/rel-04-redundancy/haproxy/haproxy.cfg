# 신뢰성 설계 실습-4 HAProxy 설정. 실험마다 listen 하나를 따로 두고 같은 복제본을 가리킨다.
# 각 listen 은 서버 상태와 헬스 체크를 따로 가진다(같은 서버라도 listen 마다 판정이 다르다).
global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    option httplog
    timeout connect 50ms      # 같은 서버로 재시도할 때의 대기(min(timeout connect, 1s))를 줄이려고 짧게 둔다
    timeout client 30s
    timeout server 5s
    timeout check 1s
    retries 0                 # 재시도는 쓰는 listen 에서만 켠다

# ---------- A. 액티브-액티브 3대, 독립 고장과 공통 원인 고장 ----------
# 헬스 체크 없이 요청 단위로만 비켜 간다. 병렬식의 "즉시 전환"에 가장 가까운 설정.
listen aa_noretry
    bind :9201
    balance roundrobin
    server r1 r1:8080
    server r2 r2:8080
    server r3 r3:8080

listen aa_retry
    bind :9202
    balance roundrobin
    retries 2
    retry-on conn-failure 500 503
    option redispatch 1
    server r1 r1:8080
    server r2 r2:8080
    server r3 r3:8080

# ---------- B. 액티브-스탠바이 전환: inter x fall ----------
# a 가 액티브, b 는 backup. 모든 listen 이 같은 a, b 를 각자의 설정으로 검사한다.
listen fo_i2f3
    bind :9301
    option httpchk GET /health
    server a a:8080 check inter 2s fall 3 rise 2
    server b b:8080 check inter 2s fall 3 rise 2 backup

listen fo_i1f3
    bind :9302
    option httpchk GET /health
    server a a:8080 check inter 1s fall 3 rise 2
    server b b:8080 check inter 1s fall 3 rise 2 backup

listen fo_i1f2
    bind :9303
    option httpchk GET /health
    server a a:8080 check inter 1s fall 2 rise 2
    server b b:8080 check inter 1s fall 2 rise 2 backup

listen fo_i2f3_fast
    bind :9304
    option httpchk GET /health
    server a a:8080 check inter 2s fastinter 500ms fall 3 rise 2
    server b b:8080 check inter 2s fastinter 500ms fall 3 rise 2 backup

listen fo_i500f3
    bind :9305
    option httpchk GET /health
    server a a:8080 check inter 500ms fall 3 rise 2
    server b b:8080 check inter 500ms fall 3 rise 2 backup

listen fo_i2f3_redispatch
    bind :9306
    option httpchk GET /health
    retries 2
    retry-on conn-failure 500 503
    option redispatch 1
    server a a:8080 check inter 2s fall 3 rise 2
    server b b:8080 check inter 2s fall 3 rise 2 backup

listen fo_i2f3_observe
    bind :9307
    option httpchk GET /health
    server a a:8080 check inter 2s fall 3 rise 2 observe layer7 error-limit 10 on-error mark-down
    server b b:8080 check inter 2s fall 3 rise 2 backup

# ---------- C. TCP 검사 vs 앱 검사 ----------
listen chk_tcp
    bind :9401
    balance roundrobin
    server r1 r1:8080 check inter 1s fall 3 rise 2
    server r2 r2:8080 check inter 1s fall 3 rise 2
    server r3 r3:8080 check inter 1s fall 3 rise 2

listen chk_http
    bind :9402
    balance roundrobin
    option httpchk GET /health
    server r1 r1:8080 check inter 1s fall 3 rise 2
    server r2 r2:8080 check inter 1s fall 3 rise 2
    server r3 r3:8080 check inter 1s fall 3 rise 2

listen chk_observe
    bind :9403
    balance roundrobin
    option httpchk GET /health
    server r1 r1:8080 check inter 1s fall 3 rise 2 observe layer7 error-limit 10 on-error mark-down
    server r2 r2:8080 check inter 1s fall 3 rise 2 observe layer7 error-limit 10 on-error mark-down
    server r3 r3:8080 check inter 1s fall 3 rise 2 observe layer7 error-limit 10 on-error mark-down

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
