global:
  scrape_interval: 5s
scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["envoy:9901"] }]
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend-1:8080", "backend-2:8080", "backend-3:8080"] }]
