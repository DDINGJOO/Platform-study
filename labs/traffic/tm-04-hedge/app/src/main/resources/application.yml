spring.application.name: ${SERVICE_NAME:backend}
server:
  tomcat.threads.max: ${TOMCAT_THREADS:200}
management:
  endpoints.web.exposure.include: health,prometheus
  metrics.tags.service: ${SERVICE_NAME:backend}
  metrics.distribution.percentiles-histogram.http.server.requests: true
  metrics.distribution.slo.http.server.requests: 5ms,10ms,20ms,30ms,40ms,50ms,75ms,100ms,200ms,300ms,500ms
