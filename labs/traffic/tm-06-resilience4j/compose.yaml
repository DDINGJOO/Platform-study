# 트래픽 관리 실습-6: 같은 하위 장애에 비율 제한, 벌크헤드, 서킷 브레이커를 걸어 본다.
# 하위 서비스(downstream) 하나를 호출하는 쪽(order)을 네 대 띄우고, 감싸는 방법만 다르게 한다.
x-app: &app
  build: ./app
  image: obs-lab/tm-06-resilience4j:dev
  mem_limit: 320m

x-caller-env: &caller-env
  JAVA_TOOL_OPTIONS: -Xmx128m
  SPRING_PROFILES_ACTIVE: caller
  LAB_TOMCAT_THREADS: "25"        # 요청 처리 스레드 25개. /recommend 와 /pay 가 나눠 쓴다
  LAB_DOWNSTREAM: http://downstream:8080

services:
  downstream:
    <<: *app
    environment:
      JAVA_TOOL_OPTIONS: -Xmx160m
      SPRING_PROFILES_ACTIVE: downstream
      LAB_APP: downstream
    ports: ["${DOWNSTREAM_PORT:-28082}:8080"]

  order-rl:
    <<: *app
    environment: { <<: *caller-env, LAB_PATTERN: ratelimiter, LAB_APP: order-rl }
    ports: ["${RL_PORT:-28181}:8080"]

  order-bh:
    <<: *app
    environment: { <<: *caller-env, LAB_PATTERN: bulkhead, LAB_APP: order-bh }
    ports: ["${BH_PORT:-28182}:8080"]

  order-cb:
    <<: *app
    environment: { <<: *caller-env, LAB_PATTERN: circuitbreaker, LAB_APP: order-cb }
    ports: ["${CB_PORT:-28183}:8080"]

  order-cbbh:
    <<: *app
    environment: { <<: *caller-env, LAB_PATTERN: cb-over-bulkhead, LAB_APP: order-cbbh }
    ports: ["${CBBH_PORT:-28184}:8080"]

  # 덧붙인 확인용(profile ignore): order-cbbh 와 같되 BulkheadFullException 을 실패율에서 뺀다.
  order-cbbh-ign:
    <<: *app
    profiles: [ignore]
    environment: { <<: *caller-env, LAB_PATTERN: cb-over-bulkhead, LAB_CB_IGNORE_BULKHEAD: "true", LAB_APP: order-cbbh-ign }
    ports: ["${CBBH_IGN_PORT:-28185}:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-28090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-28000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "--summary-trend-stats=avg,p(50),p(99),max", "/scripts/load.js"]
    environment:
      DURATION: ${DURATION:-11m}
      TARGETS: ${TARGETS:-order-rl,order-bh,order-cb,order-cbbh}
    volumes:
      - ./k6:/scripts:ro
      - ./out:/out
