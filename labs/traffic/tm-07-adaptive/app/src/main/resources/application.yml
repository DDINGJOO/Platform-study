server:
  tomcat:
    mbeanregistry:
      enabled: true          # tomcat_threads_busy_threads 지표
management:
  server:
    port: 9090   # 지표는 요청 처리 스레드와 다른 커넥터로 뺀다(README 함정)
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      app: ${LAB_APP:app}
lab:
  limiter: ${LAB_LIMITER:none}
  fixed: ${LAB_FIXED:100}
