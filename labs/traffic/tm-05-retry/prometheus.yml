global:
  scrape_interval: 5s
scrape_configs:
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["198.18.27.10:9901"] }]
  - job_name: svc
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["198.18.27.11:8080", "198.18.27.12:8080", "198.18.27.13:8080"] }]
