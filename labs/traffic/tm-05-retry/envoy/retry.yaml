# 실습-5 [retry] 세 층 모두 재시도 2번(시도 3번). 서킷 브레이커는 기본값(max_retries 3)
# Envoy 하나가 세 서비스의 사이드카 노릇을 한다. 리스너 셋, 클러스터 셋.
#   k6 -> :10000(edge) -> svc-a -> :10001(a_out) -> svc-b -> :10002(b_out) -> svc-c
# 재시도와 서킷 브레이커는 클러스터마다 따로 세므로, 사이드카를 셋으로 나눠도 결과는 같다.
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }

static_resources:
  listeners:
  - name: edge
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: edge
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            virtual_hosts:
            - name: edge
              domains: ["*"]
              include_request_attempt_count: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: svc_a
                  timeout: 10s
                  retry_policy:
                    retry_on: "5xx"
                    num_retries: 2
  - name: a_out
    address: { socket_address: { address: 0.0.0.0, port_value: 10001 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: a_out
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            virtual_hosts:
            - name: a_out
              domains: ["*"]
              include_request_attempt_count: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: svc_b
                  timeout: 10s
                  retry_policy:
                    retry_on: "5xx"
                    num_retries: 2
  - name: b_out
    address: { socket_address: { address: 0.0.0.0, port_value: 10002 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: b_out
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            virtual_hosts:
            - name: b_out
              domains: ["*"]
              include_request_attempt_count: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: svc_c
                  timeout: 10s
                  retry_policy:
                    retry_on: "5xx"
                    num_retries: 2

  clusters:
  - name: svc_a
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: svc_a
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 198.18.27.11, port_value: 8080 } } }
  - name: svc_b
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: svc_b
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 198.18.27.12, port_value: 8080 } } }
  - name: svc_c
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: svc_c
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 198.18.27.13, port_value: 8080 } } }
