server:
  port: 8080
spring:
  application:
    name: backend
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      app: ${LAB_INSTANCE:unknown}
    distribution:
      # 인스턴스별 지연 분포를 Prometheus 에서 계산할 수 있게 버킷을 내보낸다
      percentiles-histogram:
        http.server.requests: true
      # 버킷 경계를 실습 지연대(수 ms ~ 수 초)에 맞춘다
      slo:
        http.server.requests: 5ms,10ms,20ms,30ms,50ms,75ms,100ms,150ms,200ms,300ms,500ms,750ms,1s,2s,5s
