# 트래픽 관리 실습-1: 느린 서버 한 대를 라운드로빈과 P2C가 다르게 피한다.
# 같은 백엔드 네 대 앞에 Envoy. app-4 만 느리다. Envoy 설정 파일(ENVOY_CONFIG)만 바꿔 가며 같은 부하를 준다.
# Envoy 여러 대 실험은 --profile multi 로 envoy-2, envoy-3 을 더 띄운다.
x-app: &app
  image: obs-lab/traffic-common-envoy:dev
  build: ../common-envoy/app
  mem_limit: 320m
  cpus: 1.0
  environment: &app-env
    JAVA_TOOL_OPTIONS: -Xmx160m
    LAB_DELAY_MS: 10            # 보통 서버: 10~20ms
    LAB_JITTER_MS: 10
    LAB_MAX_CONCURRENT: 8       # 동시에 8건까지 처리. 넘치면 앱 안에서 줄을 선다

x-envoy: &envoy
  image: envoyproxy/envoy:v1.39.3
  command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--concurrency", "2", "--log-level", "warn"]
  volumes:
    - ./envoy/${ENVOY_CONFIG:-p2c}.yaml:/etc/envoy/envoy.yaml:ro
  depends_on: [app-1, app-2, app-3, app-4]

services:
  app-1:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-1 }
    ports: ["${APP_PORT_BASE:-2610}1:8080"]
  app-2:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-2 }
    ports: ["${APP_PORT_BASE:-2610}2:8080"]
  app-3:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-3 }
    ports: ["${APP_PORT_BASE:-2610}3:8080"]
  app-4:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-4, LAB_DELAY_MS: 60, LAB_JITTER_MS: 20 }   # 느린 서버: 60~80ms
    ports: ["${APP_PORT_BASE:-2610}4:8080"]

  envoy:
    <<: *envoy
    ports: ["${ENVOY_PORT:-26080}:10000", "${ENVOY_ADMIN_PORT:-26901}:9901"]
  envoy-2:
    <<: *envoy
    profiles: [multi]
  envoy-3:
    <<: *envoy
    profiles: [multi]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-26090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../common-envoy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-26000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    environment:
      RATE: ${RATE:-400}
      DURATION: ${DURATION:-90s}
      ENVOYS: ${ENVOYS:-envoy:10000}
    volumes:
      - ../common-envoy/k6:/scripts:ro
