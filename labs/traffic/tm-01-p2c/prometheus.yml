global:
  scrape_interval: 2s
scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app-1:8080', 'app-2:8080', 'app-3:8080', 'app-4:8080']
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ['envoy:9901', 'envoy-2:9901', 'envoy-3:9901']
