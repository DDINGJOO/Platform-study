# 트래픽 관리 실습-2: 빨리 실패하는 서버가 트래픽을 빨아들이고 outlier detection이 빼낸다.
# 같은 백엔드 다섯 대 앞에 Envoy. app-5 를 /chaos 로 "즉시 503" 상태로 바꾸고 정책별로 몫을 잰다.
x-app: &app
  image: obs-lab/traffic-common-envoy:dev
  build: ../common-envoy/app
  mem_limit: 320m
  cpus: 1.0
  environment: &app-env
    JAVA_TOOL_OPTIONS: -Xmx160m
    LAB_DELAY_MS: 40            # 정상 서버: 40~60ms
    LAB_JITTER_MS: 20

services:
  app-1:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-1 }
    ports: ["${APP_PORT_BASE:-2610}1:8080"]
  app-2:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-2 }
    ports: ["${APP_PORT_BASE:-2610}2:8080"]
  app-3:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-3 }
    ports: ["${APP_PORT_BASE:-2610}3:8080"]
  app-4:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-4 }
    ports: ["${APP_PORT_BASE:-2610}4:8080"]
  app-5:
    <<: *app
    environment: { <<: *app-env, LAB_INSTANCE: app-5 }   # 고장 낼 서버. 실패는 /chaos 로 켠다
    ports: ["${APP_PORT_BASE:-2610}5:8080"]

  envoy:
    image: envoyproxy/envoy:v1.39.3
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--concurrency", "2", "--log-level", "warn"]
    volumes:
      - ./envoy/${ENVOY_CONFIG:-p2c}.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [app-1, app-2, app-3, app-4, app-5]
    ports: ["${ENVOY_PORT:-26080}:10000", "${ENVOY_ADMIN_PORT:-26901}:9901"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROM_PORT:-26090}:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../common-envoy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-26000}:3000"]

  load:
    image: grafana/k6:2.3.0
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    environment:
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-90s}
      ENVOYS: envoy:10000
    volumes:
      - ../common-envoy/k6:/scripts:ro
