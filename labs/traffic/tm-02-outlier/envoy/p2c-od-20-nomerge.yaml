# 실습-2 Envoy 설정: p2c-od-20 과 같고 update_merge_window 만 0 으로 끈다
# 백엔드 다섯 대(app-1~5). 한 대를 뺄 수 있게 상한만 올린다.
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
# 제외·복귀 사건을 한 줄씩 JSON 으로 남긴다(언제 빠지고 언제 돌아왔나)
cluster_manager:
  outlier_detection:
    event_log_path: /dev/stdout
static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          # 요청 한 건마다 한 줄: 시작 시각, 처리한 인스턴스(앱이 준 X-Instance 헤더), 상태 코드, 걸린 ms, 업스트림 주소
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%START_TIME(%s.%3f)% %RESP(X-INSTANCE)% %RESPONSE_CODE% %DURATION% %UPSTREAM_HOST%\n"
          route_config:
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: backend, timeout: 10s }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: backend
    type: STRICT_DNS
    connect_timeout: 1s
    load_balancing_policy:
      policies:
      - typed_extension_config:
          name: envoy.load_balancing_policies.least_request
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.least_request.v3.LeastRequest
            choice_count: 2          # 생략해도 2
    # 헬스 상태 변경을 1초(기본값)씩 모아 내보내는 창을 끈다. 복귀 직후의 재제외가 바로 반영된다
    common_lb_config:
      update_merge_window: 0s
    outlier_detection:
      consecutive_5xx: 5            # 기본값
      interval: 10s                 # 기본값. 복귀 판정은 이 주기에만 한다
      base_ejection_time: 30s       # 기본값. 실제 제외 시간 = 이 값 x 연속 제외 횟수
      max_ejection_percent: 20      # 기본 10. 다섯 대 중 한 대(20%)를 뺄 수 있게 올린다
    load_assignment:
      cluster_name: backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: app-1, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: app-2, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: app-3, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: app-4, port_value: 8080 } } }
        - endpoint: { address: { socket_address: { address: app-5, port_value: 8080 } } }
