# stock 파드를 한 번 죽인다. 폭발 반경 비교용: mode 만 다르다 (one / fixed 2 / fixed-percent 67 / all)
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata: {name: pod-kill-stock-one, namespace: ir03}
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  selector:
    namespaces: [ir03]
    labelSelectors: {tier: stock}
