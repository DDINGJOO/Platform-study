# stock 파드 전부에서 나가는 패킷을 100ms 늦춘다 (direction: to, target 없음 -> 선택한 파드의 송신 쪽에 tc netem)
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata: {name: delay-stock, namespace: ir03}
spec:
  action: delay
  mode: all
  selector:
    namespaces: [ir03]
    labelSelectors: {tier: stock}
  delay: {latency: 100ms, jitter: 0ms, correlation: "0"}
  direction: to
