# front 파드 하나의 컨테이너 안에서 CPU 를 태운다. 워커 2개가 각자 100% 를 목표로 돈다
# front 의 CPU 한도(limits.cpu 500m) 안에서 앱과 다투게 된다
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata: {name: stress-front, namespace: ir03}
spec:
  mode: one
  selector:
    namespaces: [ir03]
    labelSelectors: {tier: front}
  stressors:
    cpu: {workers: 2, load: 100}
