# stock 파드를 전부 한 번 죽인다. k8s/20-pdb-stock.yaml (minAvailable 2) 을 둔 상태에서 돌린다
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata: {name: pod-kill-stock-all-pdb, namespace: ir03}
spec:
  action: pod-kill
  mode: all
  gracePeriod: 0
  selector:
    namespaces: [ir03]
    labelSelectors: {tier: stock}
