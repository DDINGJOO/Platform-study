# 고친 것 1: 포트가 열린 뒤에만 Service 엔드포인트에 넣는다
# kubectl patch --type strategic 으로 stock 과 front 에 똑같이 넣는다(scripts/fix.sh)
spec:
  template:
    spec:
      containers:
      - name: app
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 1
          failureThreshold: 1
