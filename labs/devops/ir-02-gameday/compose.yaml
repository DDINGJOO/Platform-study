# 장애 대응 실습-2: 장애를 일으키고 타임라인과 사후 분석을 남긴다.
#   load → order → (Toxiproxy) → inventory
#   Prometheus(규칙) → Alertmanager → webhook(알림을 raw/ 에 기록)
# 호스트 포트는 28000번대.
x-py: &py
  image: python:3.13-alpine
  mem_limit: 128m

services:
  order:
    <<: *py
    command: ["python", "-u", "/app/service.py"]
    environment: { ROLE: order, INVENTORY_URL: "http://toxiproxy:28666", UPSTREAM_TIMEOUT: "1.0" }
    volumes: ["./app:/app:ro"]
    ports: ["${ORDER_PORT:-28080}:8080"]

  inventory:
    <<: *py
    command: ["python", "-u", "/app/service.py"]
    environment: { ROLE: inventory }
    volumes: ["./app:/app:ro"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["${TOXIPROXY_PORT:-28474}:8474"]

  load:
    <<: *py
    command: ["python", "-u", "/load/load.py"]
    environment: { RATE: "${RATE:-20}" }
    volumes: ["./load:/load:ro"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["${PROM_PORT:-28090}:9090"]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["${AM_PORT:-28093}:9093"]

  webhook:
    <<: *py
    command: ["python", "-u", "/receiver.py"]
    volumes: ["./webhook/receiver.py:/receiver.py:ro", "./raw:/out"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-28030}:3000"]
