# group_wait / group_interval / repeat_interval 은 Alertmanager 기본값(30s / 5m / 4h)을 일부러 그대로 적었다.
route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: webhook
    webhook_configs:
      - url: http://webhook:8080/
        send_resolved: true
