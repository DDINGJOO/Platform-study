global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: order
    static_configs: [{ targets: ["order:8080"] }]
  - job_name: inventory
    static_configs: [{ targets: ["inventory:8080"] }]
