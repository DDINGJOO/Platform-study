# 소스 코드 관찰 실습-2: 서비스 열 개에서 취약한 라이브러리를 쓰는 곳을 SBOM 으로 찾는다.
# 여기에는 빌드 도구 컨테이너만 있다. 서비스 열 개는 scripts/lab.py 가 docker run 으로 띄운다
# (호스트 포트 30101~30110, 라벨 lab.co02.service). 그래야 커밋이 다른 이미지를 서비스별로 골라 띄울 수 있다.
# 작업용 git 저장소는 저장소 밖 CO02_WORK(기본 /tmp/co-02-work)에 만든다.

services:
  gradle:
    image: gradle:9.8.1-jdk21
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ${CO02_WORK:-/tmp/co-02-work}:/work
      - gradle-cache:/home/gradle/.gradle
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    mem_limit: 1200m

  maven:
    image: maven:3.10.0-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ${CO02_WORK:-/tmp/co-02-work}:/work
      - m2-cache:/root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx384m
    mem_limit: 800m

volumes:
  gradle-cache:
  m2-cache:
