// 운영 쪽 오버레이: 서비스 빌드와 별개로, 배포 이미지에 얹을 jar 를 받아 둔다.
// 예전에 로깅 설정 호환 문제로 운영 팀이 고정해 둔 logback 이라는 설정이다(실습용 가정).
def extra = configurations.detachedConfiguration(
        dependencies.create('ch.qos.logback:logback-core:1.5.12'),
        dependencies.create('ch.qos.logback:logback-classic:1.5.12'))
extra.transitive = false
tasks.register('opsExtraJars', Copy) {
    from extra
    into layout.buildDirectory.dir('extra')
}
