// s02: 해소 전략으로 logback 을 옛 버전에 묶었다. 한때 새 버전에서 문제가 나서 붙여 둔 핀이다.
// dependencies 블록에는 logback 이 없고, 게시되는 POM 에도 이 규칙은 실리지 않는다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
configurations.configureEach {
    resolutionStrategy.force 'ch.qos.logback:logback-core:1.5.12', 'ch.qos.logback:logback-classic:1.5.12'
}
