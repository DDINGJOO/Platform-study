// 서비스 열 개를 한 저장소(모노레포)에 둔다. 각 서비스는 따로 이미지로 포장돼 따로 배포된다.
pluginManagement {
    plugins {
        id 'org.springframework.boot' version '4.1.1'
        id 'org.cyclonedx.bom' version '3.0.0'
        id 'com.gorylenko.gradle-git-properties' version '4.0.1'   // 문서 예시의 2.4.1 은 Gradle 9 에서 실패한다(README)
    }
}
rootProject.name = 'inventory'
(1..10).each { include String.format('s%02d', it) }
