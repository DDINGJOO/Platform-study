# co-04-openrewrite: grep, OpenRewrite FindMethods, JaCoCo 가 같은 메서드의 호출처를 몇 개로 세는지 본다.
name: co-04-openrewrite

services:
  mvn:
    image: maven:3.10.0-eclipse-temurin-21-noble
    working_dir: /work/app
    mem_limit: 1536m
    environment:
      MAVEN_OPTS: "-Xmx1g"
    volumes:
      - ./:/work
      - m2:/root/.m2
    profiles: ["tools"]

  app:
    image: eclipse-temurin:21-jre-noble
    working_dir: /work/app
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    # JaCoCo 에이전트를 tcpserver 모드로 붙인다. 6300 번으로 실행 기록을 꺼내 간다
    command: >
      java -javaagent:target/jacoco/org.jacoco.agent-runtime.jar=output=tcpserver,address=*,port=6300,includes=lab.co4.*
           -cp target/classes:target/lib/* lab.co4.App
    volumes:
      - ./:/work
    ports:
      - "31180:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      retries: 30
    profiles: ["run"]

  k6:
    image: grafana/k6:2.3.0
    volumes:
      - ./k6:/scripts:ro
    command: ["run", "/scripts/load.js"]
    environment:
      BASE: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    profiles: ["run"]

  # 부하가 끝난 뒤 실행 기록을 덤프하고 리포트를 만든다
  jacoco:
    image: eclipse-temurin:21-jre-noble
    working_dir: /work/app
    volumes:
      - ./:/work
    entrypoint: ["java", "-jar", "target/jacoco/org.jacoco.cli-nodeps.jar"]
    profiles: ["tools"]

volumes:
  m2:
