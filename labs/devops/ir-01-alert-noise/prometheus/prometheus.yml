global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s
  external_labels:
    env: lab          # 경고에도 붙는다. 억제 규칙의 equal 에 쓴다

rule_files: [/etc/prometheus/rules.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: db
    static_configs:
      - targets: [db:8080]
        labels: {service: db}
  - job_name: app
    static_configs:
      - targets: [orders-1:8080, orders-2:8080]
        labels: {service: orders}
      - targets: [payments-1:8080, payments-2:8080]
        labels: {service: payments}
      - targets: [cart-1:8080, cart-2:8080]
        labels: {service: cart}
      - targets: [search-1:8080, search-2:8080]
        labels: {service: search}
      - targets: [inventory-1:8080, inventory-2:8080]
        labels: {service: inventory}
