# G. repeat_interval 이 group_interval 의 배수가 아닐 때. 문서는 다음 배수로 올림된다고 한다.
#    group_interval 1m, repeat_interval 90s -> 2분마다 반복될 것으로 예상
route:
  receiver: human
  group_by: [alertname]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 90s
receivers:
  - name: human
    webhook_configs:
      - url: http://webhook:8080/human
