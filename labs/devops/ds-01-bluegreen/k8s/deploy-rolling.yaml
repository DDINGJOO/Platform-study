# 쿠버네티스 기본 롤링 업데이트. maxSurge 25%, maxUnavailable 25% (4개면 1개씩)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: obs-lab/ds-01-bluegreen:dev
          imagePullPolicy: Never
          env:
            - name: VERSION
              value: v1
            - name: STARTUP_DELAY
              value: 10s
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
