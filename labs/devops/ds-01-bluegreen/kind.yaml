# kind 클러스터 ds-01. 노드 하나에 NodePort 30080 을 호스트 127.0.0.1:24080 으로 연다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ds-01
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 24080
        listenAddress: 127.0.0.1
      - containerPort: 30081
        hostPort: 24081
        listenAddress: 127.0.0.1
