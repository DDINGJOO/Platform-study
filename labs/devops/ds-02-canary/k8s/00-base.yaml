apiVersion: v1
kind: Namespace
metadata:
  name: ds02
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: ds02}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: ds02}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: ds02}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: ds02}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: ds02}
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
    scrape_configs:
    - job_name: demo
      kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [ds02]}
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: demo
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8080"
        action: keep
      # ReplicaSet 마다 다른 해시. 카나리, 운영본, 대조군을 이 라벨로 가른다
      - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
        target_label: hash
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: ds02}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0
        args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=6h]
        ports: [{containerPort: 9090}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 400Mi}
        volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
      volumes: [{name: cfg, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: ds02}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: judge, namespace: ds02}
spec:
  replicas: 1
  selector: {matchLabels: {app: judge}}
  template:
    metadata: {labels: {app: judge}}
    spec:
      containers:
      - name: judge
        image: obs-lab/ds-02-canary-judge:dev
        imagePullPolicy: Never
        env:
        - {name: PROM_URL, value: "http://prometheus:9090"}
        - {name: RATE_WINDOW, value: "10s"}   # 판정 간격(step=10s)과 같게 해서 표본끼리 겹치지 않게
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: judge, namespace: ds02}
spec:
  selector: {app: judge}
  ports: [{port: 80, targetPort: 8080}]
---
# 카나리, 운영본, 대조군 파드를 가리지 않고 app=demo 면 전부 받는다
apiVersion: v1
kind: Service
metadata: {name: demo, namespace: ds02}
spec:
  selector: {app: demo}
  ports: [{port: 80, targetPort: 8080}]
