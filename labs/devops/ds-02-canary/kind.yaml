kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ds-02
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 25443          # 이 실습의 포트 대역(25000-25999) 안으로 고정
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  # 노드가 하나뿐이라 리더 선출이 필요 없다. 호스트가 바쁘면 리스 갱신이 5초를 넘겨
  # controller-manager 와 scheduler 가 계속 재시작했다(첫 실행에서 겪었다).
  # 같은 이유로 kubelet 하트비트가 늦으면 노드가 NotReady 로 찍히고 모든 엔드포인트가 빠진다.
  # 그 판정 유예를 기본 40초에서 5분으로 늘린다
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
      - {name: leader-elect, value: "false"}
      - {name: node-monitor-grace-period, value: "5m"}
    scheduler:
      extraArgs:
      - {name: leader-elect, value: "false"}
