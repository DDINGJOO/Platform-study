name: deployment-experiments-01
services:
  redis:
    image: redis:7.4
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis:/data']
    mem_limit: 128m
  kayenta:
    image: ghcr.io/spinnaker/kayenta:2026.1.3@sha256:aafecd8b090b21ef6abcd86b958e9cf64be69e01bdac3cdf30025457e232ae94
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/spinnaker/config/kayenta-local.yml
    volumes: ['./config/kayenta-local.yml:/opt/spinnaker/config/kayenta-local.yml:ro']
    ports: ['127.0.0.1:28102:8090']
    mem_limit: 900m
  front50:
    image: ghcr.io/spinnaker/front50:2026.1.3@sha256:169ac79728fe8f5ffd68fa900c0b5d2b77c3ae40477e0e65a5cde1e5cc673398
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:ActiveProcessorCount=2
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/spinnaker/config/front50-local.yml
    volumes: ['./config/front50-local.yml:/opt/spinnaker/config/front50-local.yml:ro']
    ports: ['127.0.0.1:28103:8080']
    mem_limit: 600m
  gate:
    image: ghcr.io/spinnaker/gate:2026.1.3@sha256:8eac79f1198f245a14c6dfb7e9015d3463b8a983ba5f9d18ae20674e1fadc9ab
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m -XX:ActiveProcessorCount=2
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/spinnaker/config/gate-local.yml
    volumes: ['./config/gate-local.yml:/opt/spinnaker/config/gate-local.yml:ro']
    ports: ['127.0.0.1:28101:8084']
    mem_limit: 750m
  deck:
    image: ghcr.io/spinnaker/deck:2026.1.3@sha256:481a22a5116f02247a14269ea5ddd95759f227b7d92bd3fe242c586235abdc71
    environment:
      API_HOST: http://gate:8084
      DECK_PORT: '9000'
    volumes: ['./config/settings-local.js:/opt/spinnaker/config/settings-local.js:ro']
    ports: ['127.0.0.1:28100:9000']
    mem_limit: 200m
  old:
    build: .
    image: deployment-experiments/canary-service:local
    environment: {ROLE: old, VERSION: v1, REGRESSION_MS: '0'}
    cpus: 0.5
    mem_limit: 96m
    ports: ['127.0.0.1:28110:8080']
  baseline:
    image: deployment-experiments/canary-service:local
    environment: {ROLE: baseline, VERSION: v1, REGRESSION_MS: '0'}
    cpus: 0.5
    mem_limit: 96m
    ports: ['127.0.0.1:28111:8080']
  canary:
    image: deployment-experiments/canary-service:local
    environment: {ROLE: canary, VERSION: '${CANDIDATE_VERSION:-v1}', REGRESSION_MS: '${REGRESSION_MS:-0}'}
    cpus: 0.5
    mem_limit: 96m
    ports: ['127.0.0.1:28112:8080']
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=24h']
    volumes: ['./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro', 'prometheus:/prometheus']
    ports: ['127.0.0.1:28104:9090']
    mem_limit: 200m
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes: ['./grafana/provisioning:/etc/grafana/provisioning:ro']
    ports: ['127.0.0.1:28105:3000']
    mem_limit: 768m
volumes:
  redis: {}
  prometheus: {}
