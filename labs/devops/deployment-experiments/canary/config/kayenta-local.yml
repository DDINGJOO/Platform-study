server.port: 8090
redis.connection: redis://redis:6379
kayenta:
  atlas.enabled: false
  signalfx.enabled: false
  prometheus:
    enabled: true
    accounts:
      - name: prometheus
        endpoint.baseUrl: http://prometheus:9090
        supportedTypes: [METRICS_STORE]
  memory:
    enabled: true
    accounts:
      - name: memory
        supportedTypes: [OBJECT_STORE, CONFIGURATION_STORE]
  standaloneCanaryAnalysis.enabled: true
management:
  endpoints.web:
    base-path: /
    exposure.include: health,info
ok-http-client.interceptor.skip-header-check: true
