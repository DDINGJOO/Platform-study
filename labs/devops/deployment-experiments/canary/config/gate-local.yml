server:
  port: 8084
  address: 0.0.0.0
redis.connection: redis://redis:6379
services:
  deck.baseUrl: http://localhost:28100
  front50:
    baseUrl: http://front50:8080
    canaryConfigStore: false
  kayenta:
    enabled: true
    canaryConfigStore: true
    baseUrl: http://kayenta:8090
  clouddriver:
    enabled: true
    baseUrl: http://127.0.0.1:1
  orca.enabled: false
  echo.enabled: false
  rosco.enabled: false
  fiat.enabled: false
cors:
  allowedOriginsPattern: http://localhost:28100
  allowCredentials: true
management.endpoints.web.base-path: /
management.endpoints.web.exposure.include: health,info

fiat.baseUrl: http://127.0.0.1:1
services.fiat.baseUrl: http://127.0.0.1:1
