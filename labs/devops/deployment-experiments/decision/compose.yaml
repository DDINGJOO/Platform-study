name: deployment-experiments-03
services:
  report:
    image: python:3.12.15-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    working_dir: /app
    command: ["python", "-u", "run.py", "--serve"]
    volumes: [".:/app"]
    ports: ["127.0.0.1:28300:8000"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/summary.json')"]
      interval: 2s
      timeout: 2s
      retries: 20
