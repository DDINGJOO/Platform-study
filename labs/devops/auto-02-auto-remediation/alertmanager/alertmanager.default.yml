# 비교용: group_wait, group_interval, repeat_interval 을 Alertmanager 기본값(30s, 5m, 4h)으로 둔다.
route:
  receiver: remediator
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: remediator
    webhook_configs:
      - url: http://remediator:8080/alert
        send_resolved: true
