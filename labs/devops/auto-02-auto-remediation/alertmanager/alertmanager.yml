# 자동 복구 실험용으로 간격을 줄였다. 기본값은 group_wait 30s, group_interval 5m, repeat_interval 4h.
route:
  receiver: remediator
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1m
receivers:
  - name: remediator
    webhook_configs:
      - url: http://remediator:8080/alert
        send_resolved: true
