// 서비스 하나. 플랫폼 스타터를 버전으로 의존한다(-PstarterVersion=1.1.0).
// 스타터는 사내 저장소 대신 /repo(파일 저장소)에서 받는다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories {
    maven { url = uri(findProperty('repoDir') ?: '/repo') }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "lab.platform:platform-starter:${findProperty('starterVersion') ?: '1.0.0'}"
}

bootJar { archiveFileName = 'svc.jar' }
