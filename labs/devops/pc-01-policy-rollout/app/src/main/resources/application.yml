server:
  port: 8080
  shutdown: immediate
spring:
  main:
    banner-mode: off
management:
  endpoints:
    web:
      exposure:
        include: health
platform:
  downstream: ${LAB_DOWNSTREAM:http://198.18.37.80:8080}
  policy-file: ${LAB_POLICY_FILE:}
lab:
  mode: ${LAB_MODE:lib}            # lib = 스타터의 PlatformHttp 로 호출, sidecar = 재시도 없는 클라이언트로 옆 Envoy 를 부른다
  sidecar: ${LAB_SIDECAR:http://127.0.0.1:15001}
  name: ${LAB_SVC:svc}
