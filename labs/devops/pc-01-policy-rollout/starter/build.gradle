// 플랫폼팀이 내는 공통 스타터. 서비스는 이 jar 하나만 의존성에 넣으면
// 재시도·타임아웃이 걸린 HTTP 클라이언트(PlatformHttp)를 자동 구성으로 받는다.
// 기본 정책(재시도 횟수·시도당 타임아웃)은 jar 안의 platform-defaults.properties 에 들어간다.
// 정책을 바꾸려면 새 버전을 내야 한다: gradle publish -Pversion=1.1.0 -PpolicyName=v2 ...
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'lab.platform'
if (version == 'unspecified') version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.slf4j:slf4j-api'
    api 'io.github.resilience4j:resilience4j-retry:2.4.0'
}

// 정책 기본값을 jar 에 굽는다.
def policy = [
    name       : findProperty('policyName') ?: 'v1',
    maxAttempts: findProperty('maxAttempts') ?: '1',
    timeoutMs  : findProperty('timeoutMs') ?: '2000',
]
processResources {
    inputs.properties(policy + [starterVersion: version])
    filesMatching('platform-defaults.properties') {
        expand(policy + [starterVersion: version])
    }
}

publishing {
    publications { maven(MavenPublication) { from components.java } }
    repositories { maven { url = uri(findProperty('repoDir') ?: "$rootDir/../repo") } }
}
