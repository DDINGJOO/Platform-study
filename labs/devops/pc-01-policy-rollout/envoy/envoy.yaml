# 서비스 옆 사이드카 Envoy(서비스 컨테이너의 네트워크 이름공간을 같이 쓴다).
# 앱은 127.0.0.1:15001 로 하위 서비스를 부르고, 재시도·타임아웃은 RDS 파일(/etc/envoy/dyn/rds.yaml)의 경로 설정이 정한다.
# 그 파일을 새 파일로 바꿔치우면(rename) Envoy 가 다시 읽는다. 재기동하지 않는다.
# 파일에서 읽는 RDS 도 node id·cluster 가 있어야 뜬다(없으면 기동 실패). 제어 평면이 없으니 값은 아무거나.
node: { id: sidecar, cluster: sidecar }

admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 15000 } }

static_resources:
  listeners:
  - name: egress
    address: { socket_address: { address: 127.0.0.1, port_value: 15001 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          rds:
            route_config_name: backend_route
            config_source:
              resource_api_version: V3
              path_config_source: { path: /etc/envoy/dyn/rds.yaml }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: backend
    connect_timeout: 1s
    type: STATIC
    load_assignment:
      cluster_name: backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 198.18.37.80, port_value: 8080 } } }
