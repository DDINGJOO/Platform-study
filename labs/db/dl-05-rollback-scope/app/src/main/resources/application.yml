spring:
  main:
    banner-mode: off
    web-application-type: none
  datasource:
    url: jdbc:mysql://127.0.0.1:39050/lab?useSSL=false&allowPublicKeyRetrieval=true
    username: lab
    password: lab
    hikari:
      maximum-pool-size: 4
      # 기다림을 2초로 줄여 1205 를 빨리 본다
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
logging:
  level:
    root: warn
