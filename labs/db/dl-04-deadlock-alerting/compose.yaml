# 실습용 MySQL 하나. innodb_print_all_deadlocks 는 기본값(OFF)으로 띄우고 실습 중에 켠다.
name: dl04
services:
  mysql:
    image: mysql:8.4
    container_name: dl04-mysql
    environment:
      MYSQL_ROOT_PASSWORD: labroot
      MYSQL_DATABASE: lab
    ports:
      - "127.0.0.1:39040:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plabroot"]
      interval: 2s
      timeout: 3s
      retries: 60
