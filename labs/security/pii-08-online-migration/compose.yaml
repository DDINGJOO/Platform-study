# 8편 실습: 운영 중인 테이블을 무중단으로 암호화 전환하는 순서
# MySQL 하나만 컨테이너로 띄운다. 앱(구버전·신버전 인스턴스)과 부하 생성기는 호스트에서 돈다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: labroot
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: labpass
    command: ["--max-connections=300", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["38080:3306"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulab", "-plabpass"]
      interval: 2s
      retries: 60
