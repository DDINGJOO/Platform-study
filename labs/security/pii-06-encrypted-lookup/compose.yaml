# 실습용 MySQL 하나. 데이터는 전부 가짜이고, 컨테이너를 내리면(down -v) 같이 사라진다.
name: pii06
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: labroot
      MYSQL_DATABASE: lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
    ports:
      - "127.0.0.1:38060:3306"
    command: ["--innodb-buffer-pool-size=512M"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulab", "-plab"]
      interval: 2s
      timeout: 3s
      retries: 60
