# posts/ 의 글을 티스토리에 올린다. 새 글은 비공개로 저장하고, 공개 발행은 사람이 한다.
#
# 로그인 세션(쿠키)은 이 저장소 밖, 러너 머신의 ~/.local/share/tistory-uploader 에만 있다.
# 그래서 GitHub 호스팅 러너가 아니라 그 Mac 의 self-hosted 러너에서만 돈다.
# 공개 저장소이므로 트리거는 main 푸시와 수동 실행뿐이다 — 포크 PR 이 이 Mac 에서 돌지 않게 한다.
name: tistory-sync

on:
  push:
    branches: [main]
    paths: ["posts/**", "tistory-series.json"]
  workflow_dispatch:
  # 하루 새 글 50개 제한을 넘긴 글은 다음 날 이어서 올린다. 제한이 자정에 풀리므로 00:10 KST.
  # 올릴 것이 없으면 plan 만 보고 끝난다
  schedule:
    - cron: "10 15 * * *"

concurrency:
  group: tistory-sync
  cancel-in-progress: false  # 올리는 도중에 끊으면 매니페스트에 안 적힌 글이 생긴다

permissions:
  contents: write  # 매니페스트 커밋

jobs:
  sync:
    runs-on: [self-hosted, macOS, tistory]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 마스킹 검사 (pre-commit 을 우회한 커밋 대비)
        run: python3 .claude/skills/blog-post-pipeline/assets/mask-check.py --all --extra "$HOME/.config/blog-mask.txt"

      - name: 올릴 목록
        run: ~/.local/share/tistory-uploader/venv/bin/python .claude/skills/tistory-sketch-post/assets/tistory-upload.py plan

      - name: 업로드
        run: |
          set +e
          # 러너는 노트북이다. 새벽에 잠자기에 들어가면 러너 연결이 끊겨 잡이 취소된다(2026-09-30 00:26)
          caffeinate -i ~/.local/share/tistory-uploader/venv/bin/python -u .claude/skills/tistory-sketch-post/assets/tistory-upload.py sync
          code=$?
          if [ $code -eq 3 ]; then
            echo "::error::티스토리 로그인이 만료됐다. 러너 Mac 에서 'tistory-upload.py login' 을 실행할 것"
          elif [ $code -eq 4 ]; then
            echo "::warning::티스토리 하루 50편 제한에 걸렸다. 남은 글은 내일 00:10 KST 정기 실행에서 올라간다"
            code=0
          fi
          echo "code=$code" >> "$GITHUB_ENV"

      # 실패해도 이미 올린 글의 번호는 남겨야 다음 실행이 중복을 만들지 않는다
      - name: 매니페스트 커밋
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet tistory-manifest.json && exit 0
          git config user.name "tistory-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tistory-manifest.json
          git commit -m "tistory-manifest 갱신 — ${GITHUB_SHA::7} 업로드 결과"
          # 러너가 사용자 계정으로 돌아 전역 git 자격증명 도우미가 checkout 토큰보다 먼저 잡힌다.
          # 토큰을 URL 에 직접 넣어 그 설정을 거치지 않는다
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main && git push "$remote" HEAD:main

      - name: 결과
        run: exit "${code:-1}"
